name: Test GCP WIF Auth
on:
  push:
    branches: [main]
  workflow_dispatch:    # 可以手動觸發

permissions:
  id-token: write
  contents: read

jobs:
  test-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: 'develop-495610'
          workload_identity_provider: 'projects/915281642494/locations/global/workloadIdentityPools/github-pool-shaun/providers/github-provider-shaun'

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify authentication
        run: |
          echo "=== Auth Info ==="
          gcloud auth list
          echo ""
          echo "=== Project Info ==="
          gcloud config get-value project
          echo ""
          echo "=== WIF Test Passed ==="
